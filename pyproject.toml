[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adventure-call"
version = "0.1.0"
description = "Build a codebase dependency graph with Tree-sitter and NetworkX, and serve 1-hop LOD context for any symbol."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
js = ["tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23"]

[project.scripts]
adventure-call = "adventure_call.cli:main"
vcall = "adventure_call.cli:main"

# tic-c11c: ship the built frontend (web/dist, gitignored) as adventure_call/web,
# so an installed copy serves the web UI with no Node, npm, checkout or Vite.
# only-include + sources rather than force-include (which aborts the whole build
# when its source is missing, and a Node-less install has no bundle), and
# artifacts because web/dist is gitignored -- without it hatchling drops it.
[tool.hatch.build.targets.wheel]
only-include = ["adventure_call", "web/dist"]
artifacts = ["web/dist"]

[tool.hatch.build.targets.wheel.sources]
"adventure_call" = "adventure_call"
"web/dist" = "adventure_call/web"

# The sdist carries the bundle too, so a wheel built from it -- what plain
# `uv build` does -- still ships the frontend, and an install from the sdist
# does not silently lose it.
[tool.hatch.build.targets.sdist]
artifacts = ["web/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
